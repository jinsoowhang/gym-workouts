<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your personal A/B workout log.">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <title>{% block title %}Gym Workouts{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workout</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Gym Workouts home"><span class="brand-mark" aria-hidden="true">G.</span>GYM WORKOUTS</a>
    <nav aria-label="Main navigation"><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Workout</a><a href="/history" {% if request.url.path == '/history' %}aria-current="page"{% endif %}>History</a></nav>
    <span class="header-note"><span class="status-dot"></span> Your personal training log</span>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>One session at a time.</span><span>Weights in pounds · A / B</span></footer>
</body>
</html>
