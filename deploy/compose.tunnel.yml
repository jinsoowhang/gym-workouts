services:
  tunnel:
    image: "${GYM_CLOUDFLARED_IMAGE:?Set GYM_CLOUDFLARED_IMAGE to a pinned cloudflared image}"
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - "${GYM_TUNNEL_DIR:?Set GYM_TUNNEL_DIR}:/etc/cloudflared:ro"
    depends_on:
      app:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
