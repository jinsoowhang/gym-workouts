name: gym-workouts
services:
  gym:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: gym-workouts:local
    restart: unless-stopped
    # Reachable inside the proxy's Docker network; no app port is published.
    networks:
      proxy:
        aliases: [gym-workouts]
    user: "${GYM_UID:-10001}:${GYM_GID:-10001}"
    environment:
      GYM_DATABASE_PATH: /state/app/gym.sqlite3
      GYM_WAREHOUSE_PATH: /state/warehouse/gym.duckdb
      GYM_WORKOUT_DIR: /workout
      GYM_TIMEZONE: "${GYM_TIMEZONE:-UTC}"
      GYM_PORT: "${GYM_PORT:-8010}"
      GYM_ALLOWED_HOSTS: "${GYM_PUBLIC_HOST:?Set GYM_PUBLIC_HOST},127.0.0.1,localhost"
      GYM_BIND_HOST: 0.0.0.0
      GYM_PROXY_IPS: "${GYM_PROXY_IPS:?Set GYM_PROXY_IPS to the trusted proxy address}"
      GYM_AUTH_ENABLED: "true"
      GYM_PUBLIC_URL: "https://${GYM_PUBLIC_HOST}"
      GYM_ALLOWED_EMAIL: "${GYM_ALLOWED_EMAIL:?Set the private owner allowlist}"
      GYM_SESSION_SECRET: "${GYM_SESSION_SECRET:?Set a private random session secret}"
      GYM_GOOGLE_CLIENT_ID: "${GYM_GOOGLE_CLIENT_ID:-}"
      GYM_GOOGLE_CLIENT_SECRET: "${GYM_GOOGLE_CLIENT_SECRET:-}"
    volumes:
      - "${GYM_STATE_DIR:?Set GYM_STATE_DIR}:/state"
      - "${GYM_WORKOUT_DIR:?Set GYM_WORKOUT_DIR}:/workout"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['GYM_PORT'] + '/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  proxy:
    external: true
    name: "${GYM_PROXY_NETWORK:-npm_default}"
